# yaml-language-server: $schema=https://raw.githubusercontent.com/mui/toolpad/v0.12.0/docs/schemas/v1/definitions.json#properties/Page

apiVersion: v1
kind: page
spec:
  displayName: CS KPI Dashboard
  alias:
    - hr03hdi
  title: CS Dashboard
  queries:
    - name: metricEvents
      query:
        kind: rest
        url: https://mui.zendesk.com/api/v2/ticket_metrics
        searchParams:
          - name: start_time
            value:
              $$jsExpression: |
                const days = 30
                Math.round(new Date().getTime() / 1000) - 3600 * 24 * days
        headers:
          - name: Authorization
            value:
              $$env: ZENDESK
        method: GET
        transform: >
          /*

          const days = 30

          const minDate = new Date((Math.round(new Date().getTime() / 1000) -
          3600 * 24 * days) * 1000).toISOString();

          */

          return data
            .ticket_metrics
          //  .filter((metric) => metric.created_at > minDate);
        transformEnabled: true
    - name: fetchTicketIds
      query:
        kind: rest
        url: https://mui.zendesk.com/api/v2/tickets/show_many
        searchParams:
          - name: ids
            value:
              $$jsExpression: |
                parameters.ids
        headers:
          - name: Authorization
            value:
              $$env: ZENDESK
        method: GET
        transform: |-
          return data.tickets.reduce((acc, item) => {
            acc[item.id] = {
              tags: item.tags,
            };
            return acc;
          }, {});
        transformEnabled: true
      parameters:
        - name: ids
          value:
            $$jsExpression: |
              metricEvents.rows.map((row) => row.ticket_id).join(",")
    - name: totalCreated
      mode: query
      query:
        kind: rest
        url: https://mui.zendesk.com/api/v2/incremental/tickets.json?
        headers:
          - name: Authorization
            value:
              $$env: ZENDESK
        method: GET
        transform: >
          /* const tickets = data.tickets || [];

            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);

            const createdLast7Days = tickets.filter(ticket => {
              const createdAt = new Date(ticket.created_at);
              return createdAt >= sevenDaysAgo;
            });

            return createdLast7Days.length;

            return createdLast7Days.length; // Must return a value!
          */


          const rawTickets = data.tickets || [];


          // Remove duplicates: Use a Set to track seen keys (id + updated_at)

          const seen = new Set();

          const tickets = rawTickets.filter((ticket) => {
            const uniqueKey = `${ticket.id}-${ticket.updated_at}`;
            if (seen.has(uniqueKey)) {
              return false;
            }
            seen.add(uniqueKey);
            return true;
          });


          // Date boundaries

          const now = new Date();

          const start7DaysAgo = new Date(now);

          start7DaysAgo.setDate(now.getDate() - 7);


          const start14DaysAgo = new Date(now);

          start14DaysAgo.setDate(now.getDate() - 14);


          const start30DaysAgo = new Date(now);

          start30DaysAgo.setDate(now.getDate() - 30);


          // Metrics

          let createdLast7 = 0;

          let created7to14 = 0;

          let createdLast30 = 0;

          let solvedLast7 = 0;

          let solvedLast30 = 0;


          tickets.forEach((ticket) => {
            const createdAt = new Date(ticket.created_at);
            const updatedAt = new Date(ticket.updated_at);
            const isSolved = ticket.status === "solved" || ticket.status === "closed";

            if (createdAt >= start7DaysAgo) {
              createdLast7++;
            }

            if (createdAt >= start14DaysAgo && createdAt < start7DaysAgo) {
              created7to14++;
            }

            if (createdAt >= start30DaysAgo) {
              createdLast30++;
            }

            if (isSolved && updatedAt >= start7DaysAgo) {
              solvedLast7++;
            }

            if (isSolved && updatedAt >= start30DaysAgo) {
              solvedLast30++;
            }
          });


          return {
            createdLast7,
            created7to14,
            createdLast30,
            solvedLast7,
            solvedLast30,
          };
        transformEnabled: true
        searchParams: [{ name: start_time, value: { $$jsExpression: const days = 30

                    Math.round(new Date().getTime() / 1000) - 3600 * 24 * days } }]
    - name: ticketMetric1
      mode: query
      query:
        kind: rest
        url: https://mui.zendesk.com/api/v2/ticket_metrics
        headers: [{ name: Authorization, value: { $$env: ZENDESK } }]
        method: GET
        searchParams:
          - name: page[size]
            value: '100'
        transform: >
          const tickets = (data?.ticket_metrics || []).reduce((acc, ticket) => {
            const createdAt = new Date(ticket.created_at);
            const solvedAt = ticket.solved_at ? new Date(ticket.solved_at) : null;

            const now = Date.now();
            const sevenDaysAgo = new Date(now - 7 * 24 * 60 * 60 * 1000);
            const fourteenDaysAgo = new Date(now - 14 * 24 * 60 * 60 * 1000);
            const thirtyDaysAgo = new Date(now - 30 * 24 * 60 * 60 * 1000);
            const sixtyDaysAgo = new Date(now - 60 * 24 * 60 * 60 * 1000);

            const firstReply = ticket.first_resolution_time_in_minutes?.business ?? null;
            const requesterWait = ticket.requester_wait_time_in_minutes?.business ?? null;
            const resolutionTime = ticket.full_resolution_time_in_minutes?.business ?? null;

            acc[ticket.ticket_id] = {
              created_at: ticket.created_at,
              solved_at: ticket.solved_at ?? null,
              resolution_time_minutes: resolutionTime,
              reply_time_minutes: ticket.reply_time_in_minutes?.business ?? null,
              first_reply_time_minutes: firstReply,
              requester_wait_time_minutes: requesterWait,
              number_of_replies: ticket.replies ?? 0,

              // ✅ Created date buckets (added createdPrevious7Days & createdPrevious30Days)
              createdLast7Days: createdAt >= sevenDaysAgo,
              createdPrevious7Days: createdAt >= fourteenDaysAgo && createdAt < sevenDaysAgo,
              createdLast30Days: createdAt >= thirtyDaysAgo,
              createdPrevious30Days: createdAt >= sixtyDaysAgo && createdAt < thirtyDaysAgo,

              // ✅ Solved date buckets (unchanged)
              solvedLast7Days: solvedAt ? solvedAt >= sevenDaysAgo : false,
              solvedLast30Days: solvedAt ? solvedAt >= thirtyDaysAgo : false,
              solvedPrevious7Days: solvedAt ? solvedAt >= fourteenDaysAgo && solvedAt < sevenDaysAgo : false,
              solvedPrevious30Days: solvedAt ? solvedAt >= sixtyDaysAgo && solvedAt < thirtyDaysAgo : false,

              // ✅ First Reply Time in buckets (using createdAt for bucket filter)
              firstReplyLast7Days: createdAt >= sevenDaysAgo ? firstReply : null,
              firstReplyPrevious7Days: createdAt >= fourteenDaysAgo && createdAt < sevenDaysAgo ? firstReply : null,
              firstReplyLast30Days: createdAt >= thirtyDaysAgo ? firstReply : null,
              firstReplyPrevious30Days: createdAt >= sixtyDaysAgo && createdAt < thirtyDaysAgo ? firstReply : null,

              // ✅ Requester Wait Time in buckets
              requesterWaitLast7Days: createdAt >= sevenDaysAgo ? requesterWait : null,
              requesterWaitPrevious7Days: createdAt >= fourteenDaysAgo && createdAt < sevenDaysAgo ? requesterWait : null,
              requesterWaitLast30Days: createdAt >= thirtyDaysAgo ? requesterWait : null,
              requesterWaitPrevious30Days: createdAt >= sixtyDaysAgo && createdAt < thirtyDaysAgo ? requesterWait : null,
            };

            return acc;
          }, {});


          return {
            tickets,
            after_cursor: data?.meta?.after_cursor ?? null,
          };
        transformEnabled: true
